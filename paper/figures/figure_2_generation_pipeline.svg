   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle" x="396" y="49.7415" transform="rotate(-0 396 49.7415)">Dataset generation and validation pipeline</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.182156 103.778664)">Seeded latent generator</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(65.338406 116.876086)">unique entities + total order</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(335.451563 103.778664)">Adjacent-edge premises</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(303.598437 116.876086)">endpoint / internal / distance queries</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(576.283469 103.778664)">Exact oracle + invariant checks</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(572.605344 116.876086)">acyclicity, distance, gold balance</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(589.656906 259.298664)">Latent-ID split assignment</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(576.430344 272.396086)">training / pilot / validation / test</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(328.797656 259.298664)">Matched TR / EN rendering</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(302.442187 272.396086)">name controls + presentation factors</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(52.150906 259.298664)">Semantic normalization + hashes</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(64.395437 272.396086)">human review gate: pending</text>
   </g>
